name: Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    # The capture tests read the committed PCAPs with the real tshark binary
    # rather than a mock, so tshark is a genuine test dependency.
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tshark

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r automation/requirements.txt

    - name: Run tests
      run: |
        pytest automation/tests/ -v

    - name: Lint
      run: |
        flake8 automation/ detection-engineering/ pcaps/ assets/
